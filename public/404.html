<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Workout</title>
    <style>
      html {
        background: #0f172a;
      }
    </style>
    <script>
      // GitHub Pages has no SPA rewrite rule: a hard refresh on a client-side
      // route (e.g. /workout/history) asks the server for a file that does not
      // exist, so Pages serves this 404 page. Rewrite the URL into a form the
      // app shell *can* be served for — /workout/?/history — and let the
      // snippet in index.html restore the real path before React Router boots.
      //
      // Once the service worker is installed its navigateFallback handles this
      // and we never get here; this covers the first visit and hard reloads
      // after the SW has been evicted.
      //
      // The site lives at a project subpath, so keep the first path segment
      // ('/workout') and treat everything after it as the in-app route. If the
      // repo is ever renamed or moved to a user/org root site, this must change
      // to match `base` in vite.config.ts (0 for a root site).
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
