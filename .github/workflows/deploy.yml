# Build and publish the workout PWA to GitHub Pages.
#
# NOTE: this is a *project* site, so it is served from a subpath —
# https://<user>.github.io/workout/ — not from the domain root. `base` in
# vite.config.ts must stay '/workout/' (and the router basename in
# src/main.tsx must stay '/workout') or every asset URL in the built
# index.html will point at the domain root and the deployed app will come up
# as a blank page with 404s for its JS and CSS. If the repository is ever
# renamed, change all three together.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Validate pull requests too. Without this the checks below only run once a
  # change is already on main, so a PR that breaks the build merges cleanly and
  # the first symptom is the site quietly failing to update.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests get their own per-branch group so their checks never queue
# behind a real deploy, and a superseded PR run is cancelled as soon as a new
# commit lands. Deploys keep the single global group and are never cancelled:
# Pages publishes as one atomic step, and killing it mid-flight leaves the site
# on the previous build with no clear signal why.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck, then test, then build — in that order, and each one gates
      # the next. A broken build must never reach the phone: the service
      # worker caches aggressively, so a bad deploy is genuinely annoying to
      # back out of on a device that has already installed it.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Everything below publishes, so it is skipped for pull requests: a PR is
      # validated by the three steps above and must never reach Pages.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
